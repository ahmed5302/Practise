name: Angular Application CI/CD

on:
  push:
    branches:
      - learn-2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version:24
          cache:'npm'
      - name: Install dependencies
        run: npm install
      - name: build
        run: npm run build
  Test:
    needs: build
    runs-on: ubuntu-Latest
    steps:
      - name: testing
        run: npm run test