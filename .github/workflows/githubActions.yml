name: Angular Application CI/CD

on:
  push:
    branches:
      - learn-2

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check code
        run: ls
      - name: Install dependencies
        run: npm install
      - name: build
        run: npm run build
      - name: test
        run: npm run test